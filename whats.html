<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harta Home | هارت هوم للعقارات</title>
    <!-- استدعاء خطوط جوجل بشكل احترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome للواتساب -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية الصفحة مع خلفية عقارات فخمة */
        .landing-container {
            position: relative;
            width: 100%;
            max-width: 450px; /* مثالي لشاشات الموبايل */
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px;
            text-align: center;
        }

        /* طبقة عزل سوداء شفافة لزيادة تباين النصوص */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        /* المحتوى فوق طبقة العزل */
        .content {
            position: relative;
            z-index: 2;
            color: #fff;
            margin: auto 0;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .brand-logo span {
            color: #ff6b00; /* لمسة برتقالية احترافية */
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        p {
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 35px;
            line-height: 1.6;
            padding: 0 10px;
        }

        /* زرار الواتساب النابض والمميز */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background-color: #ff6b00; /* اللون البرتقالي الجذاب عالي التباين */
            color: #fff;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(255, 107, 0, 0.3);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .whatsapp-btn i {
            font-size: 22px;
        }

        .whatsapp-btn:hover {
            background-color: #e56000;
            transform: translateY(-2px);
        }

        /* أنيميشن نبض للزرار عشان يشد عين العميل */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.5);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 107, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 0, 0);
            }
        }

        .footer {
            position: relative;
            z-index: 2;
            color: #888;
            font-size: 12px;
        }
    </style>

    <!-- Snap Pixel Code -->

    snaptr('track', 'PAGE_VIEW');
    
    </script>
    <!-- End Snap Pixel Code -->
</head>
<body>

    <div class="landing-container">
        <div class="overlay"></div>
        
        <div class="content">
            <!-- اسم البراند -->
            <div class="brand-logo">Harta <span>home</span></div>
            
            <!-- العناوين -->
            <h1>مرحباً بكم في هارت هوم للعقارات</h1>
            <p>اضغط على الزر أدناه للتواصل معنا مباشرة عبر الواتساب للاستفسار عن أحدث المشاريع، الوحدات السكنية، والعروض المميزة في العراق.</p>
            
            <!-- زر التوجيه للواتساب الحقيقي المباشر -->
            <a href="https://wa.me/9647509272525" class="whatsapp-btn">
                <i class="fab fa-whatsapp"></i>
                تواصل معنا عبر الواتساب
            </a>
        </div>

        <div class="footer">
            &copy; 2026 Harta Home. All rights reserved.
        </div>
    </div>

</body>
</html>
